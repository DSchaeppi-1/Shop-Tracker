<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Shop Tracker POC</title><style>
:root{font-family:Arial,sans-serif;color:#17202a;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}.top{background:#17202a;color:white;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:20px;margin:0}.wrap{padding:18px;max-width:1400px;margin:auto}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.metric,.panel{background:white;border:1px solid #d9dee3;border-radius:8px}.metric{padding:15px;cursor:pointer;transition:box-shadow .15s,border-color .15s}.metric:hover{border-color:#8795a1;box-shadow:0 2px 7px #0001}.metric.active{border:2px solid #273746;padding:14px;background:#f8fafb}.metric b{font-size:28px;display:block;margin-top:5px}.toolbar{display:flex;gap:10px;margin-bottom:16px}.toolbar input,.toolbar select{padding:10px;border:1px solid #bcc5ce;border-radius:6px;background:white}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.panel h2{font-size:16px;margin:0;padding:12px 14px;border-bottom:1px solid #e3e7ea}.job{padding:12px 14px;border-bottom:1px solid #edf0f2;cursor:pointer}.job:last-child{border:0}.job:hover{background:#f7f9fa}.row{display:flex;justify-content:space-between;gap:8px}.muted{color:#68737d;font-size:13px;margin-top:5px}.badge{font-size:11px;font-weight:bold;padding:4px 7px;border-radius:10px;background:#e9edf1}.late{background:#ffe0e0}.running{background:#dff3e4}.hold{background:#fff0c7}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.card{background:white;width:min(620px,100%);border-radius:10px;padding:20px}.card h2{margin-top:0}.route{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.step{padding:8px;border:1px solid #ccd3d9;border-radius:6px}.done{background:#e2f4e7}.current{font-weight:bold;border:2px solid #34495e}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button{padding:10px 14px;border:0;border-radius:6px;background:#273746;color:white;cursor:pointer}button.secondary{background:#697680}button.warn{background:#8a6116}.close{float:right;background:#697680}.empty{padding:14px;color:#6b747c}@media(max-width:900px){.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class='top'><h1>SHOP TRACKER — Proof of Concept</h1><span id='clock'></span></div><main class='wrap'><section class='metrics'><div class='metric active' data-metric='all' onclick="setMetricFilter('all')">Open Jobs<b id='openCount'></b></div><div class='metric' data-metric='today' onclick="setMetricFilter('today')">Due Today<b id='todayCount'></b></div><div class='metric' data-metric='overdue' onclick="setMetricFilter('overdue')">Overdue<b id='lateCount'></b></div><div class='metric' data-metric='hold' onclick="setMetricFilter('hold')">On Hold<b id='holdCount'></b></div></section><div class='toolbar'><input id='search' placeholder='Search order, customer, or part...'><select id='statusFilter'><option value=''>All statuses</option><option>WAITING</option><option>RUNNING</option><option>HOLD</option></select><button onclick='resetDemo()' class='secondary'>Reset Demo</button><button onclick='openSetup()' class='secondary'>Database Setup</button></div><section id='board' class='grid'></section></main><div id='modal' class='modal'><div class='card'><button class='close' onclick='closeModal()'>Close</button><div id='detail'></div></div></div><div id='setupModal' class='modal'><div class='card'><button class='close' onclick="document.getElementById('setupModal').style.display='none'">Close</button><h2>Shared Database Setup</h2><p>This build can run locally like the original POC, or connect to a shared Supabase/PostgreSQL project.</p><p><label>Project URL<br><input id='sbUrl' style='width:100%;padding:9px' placeholder='https://xxxx.supabase.co'></label></p><p><label>Publishable / anon key<br><input id='sbKey' style='width:100%;padding:9px' placeholder='Paste browser-safe project key'></label></p><div class='actions'><button onclick='saveSetup()'>Save & Connect</button><button class='secondary' onclick='disconnectDb()'>Use Local Demo</button></div><p class='muted' id='dbState'></p></div></div><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script>
const workCenters=['Engineering','Material','Tube Laser','Brake','Weld','Finishing','Shipping'];
const seed=[
{id:105827,customer:'ABC Manufacturing',part:'12345-A',qty:20,due:'TODAY',center:'Tube Laser',status:'RUNNING',route:['Engineering','Material','Tube Laser','Weld','Shipping'],notes:'Priority customer order.'},
{id:105831,customer:'Smith Co',part:'8832-B',qty:10,due:'TODAY',center:'Brake',status:'WAITING',route:['Engineering','Material','Tube Laser','Brake','Weld','Shipping'],notes:''},
{id:105842,customer:'Acme Corp',part:'9912-C',qty:50,due:'TODAY',center:'Tube Laser',status:'WAITING',route:['Material','Tube Laser','Finishing','Shipping'],notes:'Material verified.'},
{id:105851,customer:'Jones Inc',part:'7712-D',qty:12,due:'TOMORROW',center:'Material',status:'WAITING',route:['Engineering','Material','Brake','Weld','Shipping'],notes:''},
{id:105860,customer:'ABC Manufacturing',part:'8819-E',qty:6,due:'OVERDUE',center:'Engineering',status:'HOLD',route:['Engineering','Tube Laser','Brake','Shipping'],notes:'Drawing clarification required.'},
{id:105871,customer:'Northstar Fab',part:'4021-F',qty:32,due:'OVERDUE',center:'Weld',status:'RUNNING',route:['Material','Tube Laser','Brake','Weld','Finishing','Shipping'],notes:'Expedite after weld.'},
{id:105880,customer:'Metro Systems',part:'5177-G',qty:16,due:'9/18',center:'Finishing',status:'WAITING',route:['Tube Laser','Weld','Finishing','Shipping'],notes:''},
{id:105891,customer:'Acme Corp',part:'6630-H',qty:8,due:'9/19',center:'Shipping',status:'WAITING',route:['Tube Laser','Brake','Shipping'],notes:'Pack individually.'}
];
let jobs=JSON.parse(localStorage.getItem('shopPOC')||'null')||seed; let selected=null; let metricFilter='all'; let sb=null; let dbMode=false;
function save(){localStorage.setItem('shopPOC',JSON.stringify(jobs)); if(dbMode) syncSelected()}
function openSetup(){document.getElementById('sbUrl').value=localStorage.getItem('shopSbUrl')||'';document.getElementById('sbKey').value=localStorage.getItem('shopSbKey')||'';document.getElementById('dbState').textContent=dbMode?'Connected to shared database':'Local demo mode';document.getElementById('setupModal').style.display='flex'}
async function saveSetup(){localStorage.setItem('shopSbUrl',document.getElementById('sbUrl').value.trim());localStorage.setItem('shopSbKey',document.getElementById('sbKey').value.trim());await connectDb();document.getElementById('dbState').textContent=dbMode?'Connected — shared data loaded':'Connection failed — local demo retained'}
function disconnectDb(){localStorage.removeItem('shopSbUrl');localStorage.removeItem('shopSbKey');sb=null;dbMode=false;document.getElementById('dbState').textContent='Local demo mode'}
async function connectDb(){let u=localStorage.getItem('shopSbUrl'),k=localStorage.getItem('shopSbKey');if(!u||!k||!window.supabase)return;try{sb=window.supabase.createClient(u,k);let {data,error}=await sb.from('jobs').select('*').order('id');if(error)throw error;if(data&&data.length){jobs=data.map(fromDb);localStorage.setItem('shopPOC',JSON.stringify(jobs))}dbMode=true;render()}catch(e){console.error(e);dbMode=false}}
function fromDb(r){return {id:r.id,customer:r.customer,part:r.part,qty:r.qty,due:r.due,center:r.center,status:r.status,route:r.route||[],notes:r.notes||''}}
async function syncSelected(){if(!dbMode||!sb)return;let j=jobs.find(x=>x.id===selected);try{if(j){await sb.from('jobs').upsert({id:j.id,customer:j.customer,part:j.part,qty:j.qty,due:j.due,center:j.center,status:j.status,route:j.route,notes:j.notes,updated_at:new Date().toISOString()})}else if(selected){await sb.from('jobs').delete().eq('id',selected)}}catch(e){console.error(e)}}
function setMetricFilter(filter){metricFilter=filter;document.querySelectorAll('.metric').forEach(el=>el.classList.toggle('active',el.dataset.metric===filter));render()}
function render(){let q=document.getElementById('search').value.toLowerCase(), sf=document.getElementById('statusFilter').value;let f=jobs.filter(j=>(!sf||j.status===sf)&&(`${j.id} ${j.customer} ${j.part}`.toLowerCase().includes(q))&&(metricFilter==='all'||metricFilter==='today'&&j.due==='TODAY'||metricFilter==='overdue'&&j.due==='OVERDUE'||metricFilter==='hold'&&j.status==='HOLD'));document.getElementById('openCount').textContent=jobs.length;document.getElementById('todayCount').textContent=jobs.filter(j=>j.due==='TODAY').length;document.getElementById('lateCount').textContent=jobs.filter(j=>j.due==='OVERDUE').length;document.getElementById('holdCount').textContent=jobs.filter(j=>j.status==='HOLD').length;let centers=workCenters.filter(c=>f.some(j=>j.center===c));document.getElementById('board').innerHTML=centers.map(c=>`<div class='panel'><h2>${c} <span class='muted'>(${f.filter(j=>j.center===c).length})</span></h2>${f.filter(j=>j.center===c).map(jobHTML).join('')||'<div class="empty">No jobs</div>'}</div>`).join('')||'<div class="panel empty">No matching jobs.</div>'}
function jobHTML(j){let cls=j.due==='OVERDUE'?'late':j.status==='RUNNING'?'running':j.status==='HOLD'?'hold':'';return `<div class='job ${cls}' onclick='openJob(${j.id})'><div class='row'><strong>#${j.id} — ${j.part}</strong><span class='badge'>${j.status}</span></div><div class='muted'>${j.customer} · Qty ${j.qty} · Due ${j.due}</div></div>`}
function openJob(id){selected=id;let j=jobs.find(x=>x.id===id),idx=j.route.indexOf(j.center);document.getElementById('detail').innerHTML=`<h2>Order #${j.id}</h2><p><b>${j.customer}</b><br>Part: ${j.part} &nbsp; Qty: ${j.qty}<br>Due: ${j.due}</p><h3>Routing</h3><div class='route'>${j.route.map((r,i)=>`<span class='step ${i<idx?'done':''} ${i===idx?'current':''}'>${i<idx?'✓ ':''}${r}</span>`).join('')}</div><p><b>Current:</b> ${j.center}<br><b>Status:</b> ${j.status}</p><p><b>Notes:</b> ${j.notes||'None'}</p><div class='actions'><button onclick="setStatus('RUNNING')">Start Job</button><button onclick='completeJob()'>Complete Operation</button><button class='warn' onclick="setStatus('HOLD')">Place On Hold</button><button class='secondary' onclick='addNote()'>Add Note</button></div>`;document.getElementById('modal').style.display='flex'}
function setStatus(s){let j=jobs.find(x=>x.id===selected);j.status=s;save();render();openJob(selected)}
function completeJob(){let j=jobs.find(x=>x.id===selected),i=j.route.indexOf(j.center);if(i<j.route.length-1){j.center=j.route[i+1];j.status='WAITING'}else{jobs=jobs.filter(x=>x.id!==selected);closeModal()}save();render();if(jobs.some(x=>x.id===selected))openJob(selected)}
function addNote(){let j=jobs.find(x=>x.id===selected),n=prompt('Enter production note:',j.notes||'');if(n!==null){j.notes=n;save();openJob(selected)}}
function closeModal(){document.getElementById('modal').style.display='none'}
function resetDemo(){if(confirm('Reset all demo jobs?')){jobs=JSON.parse(JSON.stringify(seed));save();render()}}
document.getElementById('search').oninput=render;document.getElementById('statusFilter').onchange=render;connectDb();setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleString(),1000);render();
</script></body></html>
